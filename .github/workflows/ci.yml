name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (tipos + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Expo genera este archivo al correr `expo start`; en CI lo creamos a mano para tsc.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx expo lint

  db:
    name: Base de datos (migraciones + RLS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - run: npm test
